<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>Feed</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23101418'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%23E0A435'%3E◎%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink:#101418; --card:#1A2026; --edge:#2A323B;
    --paper:#E8E4DA; --dim:rgba(232,228,218,0.5);
    --accent:#E0A435; --pos:#5BB385; --neg:#D0604F;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--ink); color:var(--paper);
    font-family:-apple-system,'Hiragino Sans',sans-serif;
    padding:max(24px, env(safe-area-inset-top)) 14px 60px;
    max-width:560px; margin:0 auto; overscroll-behavior:none;
  }
  header { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { font-family:Georgia,'Hiragino Mincho ProN',serif; font-size:26px; }
  h1 span { color:var(--accent); }
  .hicons { display:flex; gap:8px; }
  .hicons button {
    width:38px; height:38px; border-radius:12px; font-size:17px;
    border:1px solid var(--edge); background:var(--card); color:var(--dim); cursor:pointer;
  }
  .hicons button.on { background:var(--accent); color:#1A1408; border-color:var(--accent); }
  /* level */
  .lv { margin-top:8px; }
  .lv .row1 { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; }
  .lv .name { font-weight:700; color:var(--accent); font-size:13px; }
  .lv .next { color:var(--dim); font-size:11px; }
  .lv .track { height:5px; background:var(--edge); border-radius:99px; margin-top:6px; overflow:hidden; }
  .lv .fill { height:100%; background:linear-gradient(90deg,var(--accent),#F0C870); border-radius:99px; transition:width .4s ease; }
  .badge {
    display:none; position:fixed; bottom:max(20px, env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%); z-index:99;
    padding:8px 16px; border-radius:99px; font-size:12px;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
  }
  .badge.error { display:block; background:#2A1714; color:var(--neg); border:1px solid rgba(208,96,79,0.5); }
  .badge.gold { display:block; background:#2A2310; color:var(--accent); border:1px solid rgba(224,164,53,0.5); }
  .chips { display:flex; gap:7px; overflow-x:auto; padding:14px 0 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; padding:7px 14px; border-radius:99px; font-size:13px;
    border:1px solid var(--edge); background:transparent; color:var(--dim); cursor:pointer;
  }
  .chip.on { background:var(--accent); color:#1A1408; border-color:var(--accent); font-weight:600; }
  .chip .cnt { font-size:10px; opacity:0.8; margin-left:3px; }
  .bar { display:flex; gap:8px; margin:12px 0 4px; }
  .bar button {
    flex:1; padding:12px 0; border-radius:10px; font-size:14px; font-weight:600;
    border:1px solid var(--edge); background:var(--card); color:var(--paper); cursor:pointer;
  }
  .bar button.primary { background:var(--accent); color:#1A1408; border-color:var(--accent); }
  .bar button:disabled { opacity:0.4; }
  .status { font-size:11px; color:var(--dim); margin:8px 2px; min-height:14px; }
  /* deck */
  .deck-head { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--dim); margin:8px 2px 10px; }
  .deck-head b { color:var(--paper); }
  .deck-head button, .done button.undo-mini {
    background:none; border:1px solid var(--edge); color:var(--dim);
    font-size:11px; padding:4px 12px; border-radius:99px; cursor:pointer;
  }
  .done button.undo-mini { font-size:12px; padding:8px 18px; margin-bottom:16px; }
  .stack { position:relative; height:300px; }
  .dcard {
    position:absolute; inset:0; background:var(--card);
    border:1px solid var(--edge); border-radius:18px; padding:20px 18px;
    display:flex; flex-direction:column; touch-action:none;
    will-change:transform; cursor:grab;
  }
  .dcard.back { transform:scale(0.95) translateY(10px); opacity:0.55; pointer-events:none; }
  .dcard.back.reach { border-color:rgba(224,164,53,0.7); animation:reach-glow 1.1s ease-in-out infinite; }
  @keyframes reach-glow {
    0%,100% { box-shadow:0 0 6px 1px rgba(224,164,53,0.25); }
    50% { box-shadow:0 0 22px 6px rgba(224,164,53,0.7); }
  }
  @media (prefers-reduced-motion: reduce) { .dcard.back.reach { animation:none; } }
  .dcard .score {
    font-family:Georgia,serif; font-size:30px; font-weight:700; color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .dcard .score small { font-family:-apple-system,sans-serif; font-size:10px; color:var(--dim); letter-spacing:0.15em; margin-left:4px; }
  .dcard a { color:var(--paper); text-decoration:none; font-size:18px; line-height:1.5; font-weight:600; display:block; margin-top:10px; flex:1; overflow:hidden; }
  .dcard .desc {
    font-size:12px; color:var(--dim); line-height:1.6; margin:6px 0 8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .dcard .sub { font-size:12px; color:var(--dim); }
  .dcard .sub .genre { color:var(--accent); }
  .dcard .sub .stars { margin-left:5px; letter-spacing:0.12em; font-size:12px; }
  .dcard .sub .stars.mid { color:#fff; }
  .dcard .sub .stars.high { color:#4FA8FF; text-shadow:0 0 6px rgba(79,168,255,0.6); }
  .dcard .sub .stars.max {
    background:linear-gradient(180deg,#ff4040 20%,#2a0606 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 4px rgba(255,64,64,0.5));
  }
  .ov {
    position:absolute; top:16px; font-size:22px; font-weight:800; padding:6px 14px;
    border-radius:10px; border:2.5px solid; opacity:0; transform:rotate(-8deg);
  }
  .ov.yes { left:16px; color:var(--pos); border-color:var(--pos); }
  .ov.no  { right:16px; color:var(--neg); border-color:var(--neg); transform:rotate(8deg); }
  .deck-acts { display:flex; gap:12px; margin-top:14px; }
  .deck-acts button {
    flex:1; padding:15px 0; border-radius:13px; font-size:16px; font-weight:700;
    border:1.5px solid; background:transparent; cursor:pointer;
  }
  .deck-acts .yes { color:var(--pos); border-color:rgba(91,179,133,0.5); }
  .deck-acts .no  { color:var(--dim); border-color:var(--edge); }
  .hint { text-align:center; font-size:11px; color:var(--dim); margin-top:10px; }
  /* completion */
  .done {
    text-align:center; padding:46px 0 30px;
  }
  .done .big { font-family:Georgia,serif; font-size:30px; color:var(--accent); }
  .done .stats { font-size:14px; color:var(--dim); margin:14px 0 22px; line-height:1.9; }
  .done .stats b.y { color:var(--pos); } .done .stats b.n { color:var(--neg); }
  .done button, #recArt {
    padding:14px 30px; border-radius:12px; border:none; background:var(--accent);
    color:#1A1408; font-size:15px; font-weight:700; cursor:pointer;
  }
  .done button:disabled, #recArt:disabled { background:var(--edge); color:var(--dim); }
  .empty { text-align:center; color:var(--dim); font-size:13px; padding:34px 0; line-height:1.8; }
  .empty #recArt { margin-top:16px; }
  /* saved list */
  .col-head { display:flex; gap:6px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .col-head .rt {
    background:none; border:1px solid var(--edge); color:var(--dim);
    font-size:11px; padding:5px 10px; border-radius:99px; cursor:pointer;
  }
  .col-head .rt.on { border-color:var(--accent); color:var(--accent); }
  .col-head .rt.zero { opacity:0.45; }
  .col-head #clearSaved {
    margin-left:auto; background:none; border:1px solid rgba(208,96,79,0.5); color:rgba(208,96,79,0.7);
    font-size:11px; padding:6px 12px; border-radius:99px; cursor:pointer;
  }
  .rbadge {
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.08em;
    padding:1px 7px; border-radius:6px; margin-right:6px; vertical-align:middle;
  }
  .rbadge.ssr { background:linear-gradient(135deg,#ff5e5e,#ffd25e,#5effa0,#5ec8ff,#b15eff); color:#1A1408; }
  .rbadge.sr { background:var(--accent); color:#1A1408; }
  .rbadge.r { background:#9BA8B5; color:#1A1408; }
  .rbadge.n { background:var(--edge); color:var(--dim); }
  .art { background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:13px 14px; margin-top:9px; }
  .art.ssr { border-color:transparent; background:
    linear-gradient(var(--card),var(--card)) padding-box,
    linear-gradient(135deg,#ff5e5e,#ffd25e,#5effa0,#5ec8ff,#b15eff) border-box; }
  .art.sr { border-color:rgba(224,164,53,0.6); }
  .art .top { display:flex; gap:10px; align-items:flex-start; }
  .art a { color:var(--paper); text-decoration:none; font-size:15px; line-height:1.45; font-weight:500; display:block; }
  .art .sub { font-size:11px; color:var(--dim); margin-top:5px; }
  .art .sub .genre { color:var(--accent); }
  .art .del { background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:2px 6px; }
  /* feed manager */
  .mgr { margin-top:26px; padding-top:14px; }
  .radar-sec { background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:14px; margin-bottom:18px; }
  .radar-title { font-size:13px; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .radar-sec svg { width:100%; height:auto; display:block; }
  .radar-note { font-size:11px; color:var(--dim); text-align:center; margin-top:4px; }
  .ach-sec { background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:14px; margin-bottom:18px; }
  .ach-row { display:flex; gap:8px; font-size:12px; padding:6px 2px; border-bottom:1px solid rgba(42,50,59,0.5); }
  .ach-row:last-child { border-bottom:none; }
  .ach-row .nm { font-weight:600; }
  .ach-row.locked { color:var(--dim); opacity:0.55; }
  .ach-row .ds { color:var(--dim); flex:1; }
  .cat-sec { background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:14px; margin-bottom:18px; }
  .cat-cur, .cat-sug { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .cat-chip {
    display:inline-flex; align-items:center; gap:4px; font-size:12px;
    border:1px solid var(--edge); color:var(--paper); padding:5px 10px; border-radius:99px;
  }
  .cat-chip button { background:none; border:none; color:var(--dim); cursor:pointer; font-size:13px; padding:0 2px; }
  .cat-sug .cat-chip { color:var(--dim); cursor:pointer; }
  .cat-add { display:flex; gap:8px; }
  .cat-add input { flex:1; padding:9px 12px; border-radius:9px; border:1px solid var(--edge); background:rgba(0,0,0,0.25); color:var(--paper); font-size:13px; outline:none; }
  .cat-add button { padding:9px 16px; border-radius:9px; border:none; background:var(--accent); color:#1A1408; font-size:13px; font-weight:700; cursor:pointer; }
  .feed-row { display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid rgba(42,50,59,0.5); font-size:13px; }
  .dot { flex:0 0 8px; width:8px; height:8px; border-radius:99px; background:var(--dim); }
  .dot.ok { background:var(--pos); } .dot.fail { background:var(--neg); }
  .feed-row .g { color:var(--accent); font-size:11px; flex:0 0 auto; }
  .feed-row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed-row .del { background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:2px 6px; }
  .add { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .add input, .add select {
    padding:11px 12px; border-radius:9px; border:1px solid var(--edge);
    background:rgba(0,0,0,0.25); color:var(--paper); font-size:14px; outline:none;
  }
  .add button {
    padding:12px 0; border-radius:9px; border:none; background:var(--accent);
    color:#1A1408; font-size:14px; font-weight:700; cursor:pointer;
  }
  .add button.ghost { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  .res-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid rgba(42,50,59,0.5); }
  .res-row .info { flex:1; min-width:0; }
  .res-row .t { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .res-row .m { font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .res-row .addF {
    flex:0 0 auto; padding:8px 14px; border-radius:9px; font-size:12px; font-weight:700;
    border:none; background:var(--accent); color:#1A1408; cursor:pointer;
  }
  .res-row .addF:disabled { background:var(--edge); color:var(--dim); }
  .res-note { font-size:11px; color:var(--dim); padding:10px 2px 2px; }
  .rec-add { text-align:left; margin:0 0 22px; }
  .rec-add-t { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .io { display:flex; gap:8px; margin-top:18px; }
  .io button {
    flex:1; padding:10px 0; border-radius:9px; font-size:12px;
    border:1px solid var(--edge); background:transparent; color:var(--dim); cursor:pointer;
  }
  .io button#resetBtn { border-color:rgba(208,96,79,0.5); color:rgba(208,96,79,0.5); }
  /* match fx */
  .fx-big { animation:fx-glow-gold 0.5s ease-in-out 5; }
  .fx-premium { animation:fx-glow-rainbow 2.5s linear 1; border-color:transparent!important; }
  @keyframes fx-glow-gold {
    0%,100% { box-shadow:0 0 0 1px var(--edge); }
    50% { box-shadow:0 0 24px 6px rgba(224,164,53,0.85), 0 0 0 1px var(--accent); }
  }
  @keyframes fx-glow-rainbow {
    0% { box-shadow:0 0 24px 6px hsla(0,90%,60%,0.85); }
    16.6% { box-shadow:0 0 24px 6px hsla(60,90%,60%,0.85); }
    33.3% { box-shadow:0 0 24px 6px hsla(120,90%,60%,0.85); }
    50% { box-shadow:0 0 24px 6px hsla(180,90%,60%,0.85); }
    66.6% { box-shadow:0 0 24px 6px hsla(240,90%,60%,0.85); }
    83.3% { box-shadow:0 0 24px 6px hsla(300,90%,60%,0.85); }
    100% { box-shadow:0 0 0 1px var(--edge); }
  }
  .fx-rays {
    position:absolute; inset:-50%; pointer-events:none; border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(224,164,53,0.35), transparent 12%, transparent 25%,
      rgba(224,164,53,0.35) 37%, transparent 50%, transparent 62%,
      rgba(224,164,53,0.35) 75%, transparent 88%, transparent 100%);
    animation:fx-spin 6s linear infinite;
    mix-blend-mode:screen;
  }
  .fx-premium .fx-rays {
    background:conic-gradient(from 0deg,
      hsla(0,90%,65%,0.35), hsla(60,90%,65%,0.35), hsla(120,90%,65%,0.35),
      hsla(180,90%,65%,0.35), hsla(240,90%,65%,0.35), hsla(300,90%,65%,0.35), hsla(360,90%,65%,0.35));
    animation:fx-spin 4s linear infinite;
  }
  @keyframes fx-spin { to { transform:rotate(360deg); } }
  .fx-sparkle {
    position:absolute; z-index:2; pointer-events:none; color:var(--accent);
    animation:fx-sparkle 1.4s ease-out forwards;
  }
  .fx-premium .fx-sparkle { color:#fff; }
  @keyframes fx-sparkle {
    0% { opacity:0; transform:translateY(0) scale(0.4) rotate(0deg); }
    20% { opacity:1; transform:translateY(-8px) scale(1.1) rotate(60deg); }
    100% { opacity:0; transform:translateY(-46px) scale(0.6) rotate(200deg); }
  }
  .fx-banner {
    position:absolute; top:-14px; left:50%; z-index:3; pointer-events:none;
    transform:translate(-50%,-60px); white-space:nowrap;
    font-family:Georgia,serif; font-weight:800; font-size:18px;
    padding:8px 22px; border-radius:99px; border:2px solid;
    animation:fx-drop 2.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .fx-banner-big {
    background:linear-gradient(135deg,#F0C870,var(--accent));
    color:#1A1408; border-color:#F0C870;
    box-shadow:0 4px 18px rgba(224,164,53,0.6);
  }
  .fx-banner-premium {
    background:linear-gradient(135deg,#ff5e5e,#ffd25e,#5effa0,#5ec8ff,#b15eff);
    background-size:300% 300%;
    color:#1A1408; border-color:#fff;
    box-shadow:0 4px 18px rgba(255,255,255,0.5);
    animation:fx-drop 2.5s cubic-bezier(.34,1.56,.64,1) forwards, fx-rainbow-bg 1.5s linear infinite;
  }
  @keyframes fx-drop {
    0% { transform:translate(-50%,-60px); opacity:0; }
    50% { transform:translate(-50%,8px); opacity:1; }
    65% { transform:translate(-50%,-6px); }
    80% { transform:translate(-50%,2px); }
    100% { transform:translate(-50%,0); opacity:1; }
  }
  @keyframes fx-rainbow-bg {
    0% { background-position:0% 50%; }
    100% { background-position:100% 50%; }
  }
  .fx-flash {
    position:fixed; inset:0; z-index:999; pointer-events:none;
    background:#fff; opacity:0;
    animation:fx-flash 0.3s ease-out forwards;
  }
  @keyframes fx-flash {
    0% { opacity:0; }
    15% { opacity:0.9; }
    100% { opacity:0; }
  }
</style>
</head>
<body>
<header>
  <h1>Feed<span>.</span></h1>
  <div class="hicons">
    <button id="navSaved" title="保存済み">★</button>
    <button id="navMgr" title="管理">⚙</button>
  </div>
</header>
<div class="lv">
  <div class="row1">
    <span class="name" id="lvName">Lv.1 見習い</span>
    <span class="next" id="lvNext"></span>
  </div>
  <div class="track"><div class="fill" id="lvFill" style="width:0%"></div></div>
</div>
<div class="badge" id="badge"></div>

<div class="chips" id="chips"></div>

<div class="bar"><button class="primary" id="refresh">記事を取得</button></div>
<div class="status" id="status"></div>

<div id="stage"><div class="empty">「記事を取得」で開始。<br>カードを右スワイプ＝◎ / 左スワイプ＝×。</div></div>

<div class="mgr" style="display:none">
  <div id="mgrBody">
    <div class="radar-sec">
      <div class="radar-title">好みの傾向</div>
      <div id="radarBox"></div>
      <div class="radar-note" id="radarNote"></div>
    </div>
    <div class="ach-sec">
      <div class="radar-title">実績 <span id="achCount"></span></div>
      <div id="achList"></div>
    </div>
    <div class="cat-sec">
      <div class="radar-title">カテゴリ</div>
      <div class="cat-cur" id="catCur"></div>
      <div class="res-note">候補から追加:</div>
      <div class="cat-sug" id="catSug"></div>
      <div class="cat-add">
        <input type="text" id="catInput" placeholder="自由入力で追加（例: 将棋）">
        <button id="catAddBtn">追加</button>
      </div>
    </div>
    <div id="feedList"></div>
    <div class="add" style="margin-top:16px">
      <select id="searchGenre"></select>
      <input type="text" id="q" placeholder="キーワード または サイトURLで検索">
      <button id="searchBtn">フィードを検索</button>
      <button class="ghost" id="recBtn">学習傾向からおすすめフィードを探す</button>
    </div>
    <div id="searchResults"></div>
    <div class="add">
      <select id="addGenre"></select>
      <input type="text" id="addName" placeholder="フィード名（手動追加）">
      <input type="url" id="addUrl" placeholder="RSSのURL（https://...）">
      <button id="addBtn">フィードを追加</button>
    </div>
    <div class="io">
      <button id="exportBtn">データを書き出す</button>
      <button id="importBtn">データを読み込む</button>
      <button id="resetBtn">学習をリセット</button>
      <button id="sndBtn"></button>
    </div>
  </div>
</div>

<script>
const KEY = "news-app-v1";
const CACHE_KEY = "news-articles-v1";
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),

// ── learning ──
function feats(text){
  const f=new Set(), t=text.toLowerCase();
  (t.match(/[a-z0-9]{2,}/g)||[]).forEach(w=>f.add(w));
  t.replace(/[^\u3040-\u30ff\u4e00-\u9fff\u30fc]+/g," ").split(" ").forEach(seq=>{
    if(seq.length===1) f.add(seq);
    for(let i=0;i<seq.length-1;i++) f.add(seq.slice(i,i+2));
  });
  return [...f];
}
function scoreOf(title){
  const m=S.model, fs=feats(title);
  if(!fs.length || (m.likeN+m.disN)===0) return 0;
  // 適応平滑化: 学習が進むほど平滑化を緩めて判別を鋭くする（下限0.02）
  const e=Math.max(0.02, 2/(m.likeN+m.disN+1));
  const ws=[];
  for(const f of fs){
    const l=m.like[f]||0, d=m.dis[f]||0;
    if(l+d===0) continue;
    const rl=m.likeN?l/m.likeN:0, rd=m.disN?d/m.disN:0;
    ws.push(Math.log((rl+e)/(rd+e)));
  }
  if(!ws.length) return 0;
  // 中立語に強い手掛かりが薄められないよう、寄与の大きい上位8語の調和加重平均
  ws.sort((x,y)=>Math.abs(y)-Math.abs(x));
  const k=Math.min(8,ws.length);
  let sum=0, wsum=0;
  for(let i=0;i<k;i++){ const wt=1/(i+1); sum+=ws[i]*wt; wsum+=wt; }
  return (sum/wsum)*(ws.length/(ws.length+2));
}
function pct(score){ return Math.max(1, Math.min(99, Math.round(100/(1+Math.exp(-score*2.2))))); }
// 保存記事のレア度判定（保存時のpctが基準。pct未記録の旧データは"N"扱い）
function rarityOf(p){
  if(p==null) return "N";
  if(p>=95) return "SSR";
  if(p>=85) return "SR";
  if(p>=70) return "R";
  return "N";
}
// 表示用%の確定: バッチ中央値で中心化した絶対スコア＋バッチ内順位の合成。
// 中央値基準にすることで、◎/×どちらかに偏った学習でモデル全体が
// 正負に寄っても表示%の分布が潰れない（×ばかり押しても上位は高%になる）
// 表示%は「最近判定した記事400件の中で上位何%か」の分位写像で決める。
// BIG(85+)が判定の約1/20、PREMIUM(95+)が約1/100で出るよう曲線を固定。
// スコアの絶対値や学習の偏りに依存せず、出現頻度そのものを保証する
const PCT_CURVE=[[0,3],[0.05,15],[0.5,50],[0.8,70],[0.95,85],[0.99,95],[1,99]];
function pctFromRel(rel){
  for(let i=1;i<PCT_CURVE.length;i++){
    const [x0,y0]=PCT_CURVE[i-1],[x1,y1]=PCT_CURVE[i];
    if(rel<=x1) return y0+(y1-y0)*(rel-x0)/(x1-x0);
  }
  return 99;
}
function relIn(sortedRef, sc){
  let lo=0, eq=0;
  for(const v of sortedRef){ if(v<sc) lo++; else if(v===sc) eq++; }
  return (lo+eq/2)/sortedRef.length;
}
function calibrate(list){
  if(!list.length) return;
  // 絶対値(本当の好みの強さ)70% + 参照分布内の順位30%。
  // 参照分布=判定履歴(直近400)+現在プールの混合。88以上は上端を
  // ストレッチしてプレミア帯(95+)へ到達可能にする
  const warm=S.seenScores&&S.seenScores.length>=30;
  const ref=(warm?[...S.seenScores]:[]).concat(list.map(a=>a.score));
  ref.sort((x,y)=>x-y);
  for(const a of list){
    const abs=100/(1+Math.exp(-a.score*3.0));
    let p=0.7*abs+0.3*pctFromRel(relIn(ref,a.score));
    if(p>=88) p=88+(p-88)*1.6;
    p=Math.round(p);
    if(!warm) p=Math.min(84,p); // 履歴が溜まるまで当たり演出は出さない
    a.pct=Math.max(1, Math.min(99, p));
  }
}
// 鮮度ボーナス: 並び順にのみ加味し、表示%（マッチ度）には影響させない
function freshBonus(ts){
  if(!ts) return 0;
  const h=(Date.now()-ts)/3600000;
  if(h<=24) return 0.15;
  if(h<=72) return 0.05;
  return 0;
}
function sortArticles(){
  articles.sort((a,b)=>(b.score+freshBonus(b.ts))-(a.score+freshBonus(a.ts)));

// 現在の学習モデルで全記事のスコアと表示%を再計算する。
// 記事がデッキに出る前は必ずここを通すこと（古いスコアの混入防止）
function rescore(){
  articles.forEach(a=>a.score=scoreOf(a.title));
  sortArticles();
  calibrate(articles);
}
function train(title, like){
  // 適応学習率: モデルの予想が外れた判定ほど大きく学習する（0.5〜2.5）
  const prob=1/(1+Math.exp(-scoreOf(title)*2.2));
  const lr=0.5+2*(like?(1-prob):prob);
  const m=S.model;
  for(const f of feats(title)){ const tbl=like?m.like:m.dis; tbl[f]=(tbl[f]||0)+lr; }
  if(like) m.likeN+=lr; else m.disN+=lr;
  return lr;
}
// trainの厳密な逆操作（Undo用）
function untrain(title, like, lr=1){
  const m=S.model;
  for(const f of feats(title)){
    const tbl=like?m.like:m.dis;
    if(tbl[f]!=null){ tbl[f]-=lr; if(tbl[f]<1e-9) delete tbl[f]; }
  }
  if(like) m.likeN=Math.max(0,m.likeN-lr); else m.disN=Math.max(0,m.disN-lr);
}

// ── level ──
function lvThreshold(l){ return 10*l*(l+1)/2; } // L2:10 L3:30 L4:60 L5:100...
function renderLevel(){
  const total=judgeCount();
  let lv=1;
  while(lv<LV_TITLES.length && total>=lvThreshold(lv)) lv++;
  const lo=lvThreshold(lv-1), hi=lvThreshold(lv);
  const maxed=lv>=LV_TITLES.length && total>=lvThreshold(LV_TITLES.length-1);
  document.getElementById("lvName").textContent="Lv."+lv+" "+LV_TITLES[lv-1];
  document.getElementById("lvNext").textContent=maxed?"判定 "+total+"件 ・ MAX":"次のLvまであと"+(hi-total)+"判定（計"+total+"件）";
  document.getElementById("lvFill").style.width=(maxed?100:Math.round((total-lo)/(hi-lo)*100))+"%";
}

// ── fetch & parse ──
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return "h"+(h>>>0).toString(36); }
function parseFeed(xmlText, feed){
  const doc=new DOMParser().parseFromString(xmlText,"text/xml");
  if(doc.querySelector("parsererror")) return [];
  let nodes=[...doc.querySelectorAll("item")];
  if(!nodes.length) nodes=[...doc.querySelectorAll("entry")];
  return nodes.slice(0,15).map(n=>{
    const q=t=>n.querySelector(t);
    const title=(q("title")?.textContent||"").trim();
    let link=q("link")?.textContent?.trim();
    if(!link) link=q("link")?.getAttribute("href")||"";
    let date=q("pubDate")?.textContent || q("updated")?.textContent || q("published")?.textContent || "";
    if(!date){ const dc=n.getElementsByTagName("dc:date"); if(dc.length) date=dc[0].textContent; }
    if(!title||!link) return null;
    const t=date?new Date(date).getTime():0;
    const rawDesc=q("description")?.textContent || q("summary")?.textContent || q("content")?.textContent || "";
    const desc=rawDesc?new DOMParser().parseFromString(rawDesc,"text/html").body.textContent.replace(/\s+/g," ").trim().slice(0,120):"";
    return { hash:hash(link), title, link, genre:feed.genre, source:feed.name, ts:isNaN(t)?0:t, desc,
             date: date?new Date(date).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"}):"" };
  }).filter(Boolean);
}
// 全URLへ同時にリクエストし、最初に検証を通った応答を採用して残りは中断する
function raceFirst(urls, ms, parse){
  return new Promise(resolve=>{
    let pending=urls.length, done=false;
    if(!pending) return resolve(null);
    const ctrls=urls.map(()=>new AbortController());
    urls.forEach((u,i)=>{
      const t=setTimeout(()=>ctrls[i].abort(),ms);
      fetch(u,{signal:ctrls[i].signal})
        .then(async res=>{
          if(!res.ok) throw 0;
          const v=await parse(res);
          if(v==null||done) throw 0;
          done=true;
          ctrls.forEach((c,j)=>{ if(j!==i) c.abort(); });
          resolve(v);
        })
        .catch(()=>{ if(--pending===0&&!done) resolve(null); })
        .finally(()=>clearTimeout(t));
    });
  });
}
async function fetchFeed(feed){
  feedStatus[feed.id]="loading"; renderFeeds();
  const items=await raceFirst(PROXIES.map(p=>p(feed.url)), 6500, async res=>{
    const list=parseFeed(await res.text(), feed);
    return list.length?list:null;
  });
  feedStatus[feed.id]=items?"ok":"fail";
  return items||[];
}

// 新着記事を既存プールへ追加合流させる（判定中のデッキは崩さない）
let lastFetch=0;
function mergeNewArticles(items){
  const seenH=new Set(articles.map(a=>a.hash));
  const fresh=items.filter(a=>!S.rated[a.hash]&&!seenH.has(a.hash)&&seenH.add(a.hash));
  if(!fresh.length) return 0;
  articles.push(...fresh);
  rescore();
  saveArticles();
  if(!deck.length && activeGenre!=="★保存済み" && activeGenre!=="⚙管理"){ buildDeck(); renderStage(); }
  else renderChips();
  return fresh.length;

async function silentRefresh(){

// ── deck ──
function buildDeck(){
  const pool=articles.filter(a=>!S.rated[a.hash]&&(activeGenre==="すべて"||a.genre===activeGenre));
  deck=pool.slice(0,DECK_SIZE);
  // スコア順のままだと次のカードが読めてリーチ予告が成立しないため、デッキ内はランダム順
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  deckStats={yes:0,no:0};
}
// リーチ予告の抽選（カードごとに一度だけ）: 高マッチは85%で点灯、低マッチも15%でガセ点灯
function omenOf(a){
  if(a.omen===undefined){
    const high=(a.pct??pct(a.score))>=85;
    a.omen=Math.random()<(high?0.85:0.15);
  }
  return a.omen;
}
function esc(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// マッチ度を星で表現: 低(70未満)なし / 中(70+)白★ / 高(85+)青★★ / 最高(95+)赤黒★★★
function starsHTML(p){
  if(p==null||p<70) return "";
  if(p<85) return '<span class="stars mid">★</span>';
  if(p<95) return '<span class="stars high">★★</span>';
  return '<span class="stars max">★★★</span>';
}

function attachSwipe(card){
  let sx=0, sy=0, dx=0, dy=0, active=false;
  card.addEventListener("touchstart",e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; dx=0; dy=0; active=true;
    card.style.transition="none";
  },{passive:true});
  card.addEventListener("touchmove",e=>{
    if(!active) return;
    const t=e.touches[0]; dx=t.clientX-sx; dy=t.clientY-sy;
    e.preventDefault();
    card.style.transform=`translate(${dx}px,${dy*0.15}px) rotate(${dx/14}deg)`;
    card.querySelector(".ov.yes").style.opacity=Math.max(0,Math.min(1,dx/90));
    card.querySelector(".ov.no").style.opacity=Math.max(0,Math.min(1,-dx/90));
  },{passive:false});
  card.addEventListener("touchend",()=>{
    if(!active) return; active=false;
    if(dx>90) flyOut(card,true,dy);
    else if(dx<-90) flyOut(card,false,dy);
    else{
      card.style.transition="transform .22s ease";
      card.style.transform="";
      card.querySelectorAll(".ov").forEach(o=>o.style.opacity=0);
    }
  });
  // ── PC対応: マウスドラッグ ──
  let pActive=false, pDragged=false, px=0, py=0, pdx=0, pdy=0;
  card.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch") return; // タッチは既存ハンドラに任せる
    px=e.clientX; py=e.clientY; pdx=0; pdy=0; pActive=true; pDragged=false;
    card.style.transition="none";
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove",e=>{
    if(!pActive) return;
    pdx=e.clientX-px; pdy=e.clientY-py;
    if(Math.abs(pdx)>10) pDragged=true;
    card.style.transform=`translate(${pdx}px,${pdy*0.15}px) rotate(${pdx/14}deg)`;
    card.querySelector(".ov.yes").style.opacity=Math.max(0,Math.min(1,pdx/90));
    card.querySelector(".ov.no").style.opacity=Math.max(0,Math.min(1,-pdx/90));
  });
  const pEnd=()=>{
    if(!pActive) return; pActive=false;
    if(pdx>90) flyOut(card,true,pdy);
    else if(pdx<-90) flyOut(card,false,pdy);
    else{
      card.style.transition="transform .22s ease";
      card.style.transform="";
      card.querySelectorAll(".ov").forEach(o=>o.style.opacity=0);
    }
    if(pDragged){
      const link=card.querySelector("a");
      if(link){
        const suppress=ev=>{ ev.preventDefault(); ev.stopPropagation(); link.removeEventListener("click",suppress,true); };
        link.addEventListener("click",suppress,true);
      }
    }
  };
  card.addEventListener("pointerup",pEnd);
  card.addEventListener("pointercancel",pEnd);
}
function flyOut(card, like, dy=0){
  card.style.transition="transform .28s ease, opacity .28s";
  card.style.transform=`translate(${like?120:-120}vw,${dy}px) rotate(${like?22:-22}deg)`;
  card.querySelector(like?".ov.yes":".ov.no").style.opacity=1;
  snd(like?"yes":"no"); buzz(15);
  setTimeout(()=>commitRate(like),230);
}
function playMatchFx(card, p){
  const premium = p>=95;
  S.stats=S.stats||{streak:0,big:0,prem:0};
  if(premium){ S.stats.prem++; unlock("first_prem"); if(S.stats.prem>=3) unlock("prem3"); }
  else { S.stats.big++; unlock("first_big"); }
  save();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  snd(premium?"premium":"big"); buzz(premium?[80,50,80,50,160]:[60,40,60]);
  card.classList.add(premium?"fx-premium":"fx-big");

  // スコアのロールアップ（スロットのリール風カウントアップ）
  const scoreEl = card.querySelector(".score");
  if(scoreEl){
    const small = scoreEl.querySelector("small");
    const start = performance.now();
    const dur = 800;
    const tick = now=>{
      if(!scoreEl.isConnected) return;
      const t = Math.min(1, (now-start)/dur);
      const cur = Math.round(1 + (p-1) * t);
      scoreEl.firstChild.nodeValue = String(cur);
      if(t<1) requestAnimationFrame(tick);
      else scoreEl.firstChild.nodeValue = String(p);
    };
    requestAnimationFrame(tick);
  }

  // 回転する光線オーバーレイ（カード背面に重ねる）
  const rays = document.createElement("div");
  rays.className = "fx-rays";
  card.prepend(rays);

  // スパークル/紙吹雪
  const sparkleChars = ["✦","★","✧","☆"];
  for(let i=0;i<10;i++){
    const sp = document.createElement("span");
    sp.className = "fx-sparkle";
    sp.textContent = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
    sp.style.left = (Math.random()*100)+"%";
    sp.style.top = (Math.random()*100)+"%";
    sp.style.animationDelay = (Math.random()*0.4)+"s";
    sp.style.fontSize = (12+Math.random()*14)+"px";
    card.appendChild(sp);
  }

  // バナー
  const banner = document.createElement("div");
  banner.className = "fx-banner " + (premium?"fx-banner-premium":"fx-banner-big");
  banner.textContent = premium?"🌈 PREMIUM MATCH":"🎰 BIG MATCH";
  card.appendChild(banner);

  // プレミアムは全画面フラッシュ
  let flash = null;
  if(premium){
    flash = document.createElement("div");
    flash.className = "fx-flash";
    document.body.appendChild(flash);
  }

  setTimeout(()=>{
    rays.remove();
    card.querySelectorAll(".fx-sparkle").forEach(el=>el.remove());
    banner.remove();
    if(flash) flash.remove();
  }, 2500);
}
function commitRate(like){
  const a=deck[0]; if(!a) return;
  const snap={a, like, popped:null, recAdded:false};
  snap.lr=train(a.title, like);
  S.rated[a.hash]=1;
  // 判定済み記事はarticlesから除く。残すとsilentRefresh毎のrescoreが肥大化し、
  // saveArticlesのキャッシュ枠を判定済み記事が占有して起動時キャッシュが効かなくなる
  const ai=articles.findIndex(x=>x.hash===a.hash);
  if(ai>=0) articles.splice(ai,1);
  if(like&&a.recFeed&&!S.feeds.some(f=>f.url===a.recFeed.url)&&!recLiked[a.recFeed.url]){
    recLiked[a.recFeed.url]=a.recFeed; snap.recAdded=true;
  }
  if(like){ S.saved.unshift({title:a.title,link:a.link,genre:a.genre,source:a.source,date:a.date,pct:a.pct??pct(a.score)}); if(S.saved.length>200) snap.popped=S.saved.pop(); }
  like?deckStats.yes++:deckStats.no++;
  S.genreStats=S.genreStats||{};
  const gs=S.genreStats[a.genre]||(S.genreStats[a.genre]={y:0,n:0});
  like?gs.y++:gs.n++;
  S.seenScores=S.seenScores||[];
  S.seenScores.push(a.score||0);
  if(S.seenScores.length>400) S.seenScores.shift();
  S.stats.judges=(S.stats.judges||0)+1;
  deck.shift();
  lastRate=snap;

  // ── 実績判定 ──
  S.stats=S.stats||{streak:0,big:0,prem:0};
  S.stats.streak = like ? (S.stats.streak>0?S.stats.streak+1:1) : (S.stats.streak<0?S.stats.streak-1:-1);
  if(like) unlock("first_like");
  if(S.stats.streak>=10) unlock("streak10");
  else if(S.stats.streak<=-10) unlock("streak10n");
  const judgeTotal=judgeCount();
  if(judgeTotal>=100) unlock("judge100");
  if(judgeTotal>=1000) unlock("judge1000");
  if(GENRES.every(g=>{const st=(S.genreStats||{})[g]; return st&&(st.y+st.n)>0;})) unlock("all_genres");
  const h=new Date().getHours();
  if(h>=2&&h<4) unlock("night");

  save(); renderStage();
}
// 直前の判定を1段階だけ取り消す
function undoRate(){
  if(!lastRate) return;
  const {a, like, popped, recAdded}=lastRate;
  untrain(a.title, like, lastRate.lr||1);
  delete S.rated[a.hash];
  articles.push(a);
  if(like){
    const i=S.saved.findIndex(s=>s.link===a.link);
    if(i>=0) S.saved.splice(i,1);
    if(popped) S.saved.push(popped);
  }
  if(recAdded&&a.recFeed) delete recLiked[a.recFeed.url];
  const gs=(S.genreStats||{})[a.genre];
  if(gs){ if(like) gs.y=Math.max(0,gs.y-1); else gs.n=Math.max(0,gs.n-1); }
  if(like) deckStats.yes=Math.max(0,deckStats.yes-1); else deckStats.no=Math.max(0,deckStats.no-1);
  if(S.seenScores&&S.seenScores.length) S.seenScores.pop();
  if(S.stats&&S.stats.judges) S.stats.judges--;
  deck.unshift(a);
  lastRate=null;
  save(); renderStage();
}
function renderSaved(st){
  if(!S.saved.length){ st.innerHTML='<div class="empty">保存済みの記事はまだない。<br>◎を付けた記事がここに溜まる。</div>'; return; }

  const rarities=["SSR","SR","R","N"];
  const counts={SSR:0,SR:0,R:0,N:0};
  S.saved.forEach(a=>counts[rarityOf(a.pct)]++);

  const headBtns=['<button class="rt all '+(savedFilter==="all"?"on":"")+'" data-r="all">すべて '+S.saved.length+'件</button>']
    .concat(rarities.map(r=>`<button class="rt ${r.toLowerCase()} ${savedFilter===r?"on":""} ${counts[r]?"":"zero"}" data-r="${r}">${r} ${counts[r]}</button>`));

  const indexed=S.saved.map((a,i)=>({a,i})).filter(({a})=>savedFilter==="all"||rarityOf(a.pct)===savedFilter);

  const list=indexed.length
    ? indexed.map(({a,i})=>{
      const r=rarityOf(a.pct);
      return `
    <div class="art ${r.toLowerCase()}">
      <div class="top">
        <div style="flex:1">
          <a href="${esc(a.link)}" target="_blank" rel="noopener"><span class="rbadge ${r.toLowerCase()}">${r}</span>${esc(a.title)}</a>
          <div class="sub"><span class="genre">${esc(a.genre)}</span> ・ ${esc(a.source)}${a.date?" ・ "+a.date:""}</div>
        </div>
        <button class="del" data-i="${i}">×</button>
      </div>
    </div>`;
    }).join("")
    : '<div class="empty">このレア度の記事はまだない。</div>';

  st.innerHTML=`<div class="col-head">${headBtns.join("")}<button id="clearSaved">すべて削除（${S.saved.length}件）</button></div>`
    + list;

  st.querySelectorAll(".rt").forEach(b=>b.onclick=()=>{
    savedFilter=b.dataset.r; renderStage();
  });
  st.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    S.saved.splice(Number(b.dataset.i),1); save(); renderStage();
  });
  document.getElementById("clearSaved").onclick=()=>{
    if(confirm("保存済みの記事"+S.saved.length+"件をすべて削除する。元に戻せない。実行するか？")){
      S.saved=[]; unlock("purge"); save(); renderStage();
    }
  };
}

// ── radar chart ──
function renderRadar(){
  const box=document.getElementById("radarBox");
  const note=document.getElementById("radarNote");
  const stats=S.genreStats||{};
  const n=GENRES.length;
  const cx=160, cy=130, R=88;
  const angle=i=>-Math.PI/2 + i*2*Math.PI/n;

  const values=GENRES.map(g=>{
    const st=stats[g]||{y:0,n:0};
    const t=st.y+st.n;
    return t ? ((st.y+0.5)/(t+1))*(t/(t+3)) : 0;
  });
  const total=GENRES.reduce((sum,g)=>{ const st=stats[g]||{y:0,n:0}; return sum+st.y+st.n; },0);

  if(total===0){
    box.innerHTML='<div class="empty">まだ学習データがない。<br>カードを◎/×で判定すると傾向が表示される。</div>';
    note.textContent="";
    return;
  }

  let maxIdx=0;
  values.forEach((v,i)=>{ if(v>values[maxIdx]) maxIdx=i; });

  // グリッド: 同心10角形(25/50/75/100%) + 放射線
  let grid="";
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts=GENRES.map((_,i)=>{
      const a=angle(i), r=R*f;
      return (cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1);
    }).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="var(--edge)" stroke-width="1"/>`;
  });
  GENRES.forEach((_,i)=>{
    const a=angle(i);
    grid+=`<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(a)).toFixed(1)}" y2="${(cy+R*Math.sin(a)).toFixed(1)}" stroke="var(--edge)" stroke-width="1"/>`;
  });

  // データポリゴン + 頂点
  const pts=values.map((v,i)=>{
    const a=angle(i), r=R*v;
    return [(cx+r*Math.cos(a)), (cy+r*Math.sin(a))];
  });
  const polyStr=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  let data=`<polygon points="${polyStr}" fill="rgba(224,164,53,0.2)" stroke="var(--accent)" stroke-width="1.5"/>`;
  pts.forEach(p=>{
    data+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--accent)"/>`;
  });

  // ラベル
  let labels="";
  GENRES.forEach((g,i)=>{
    const a=angle(i);
    const lx=cx+105*Math.cos(a), ly=cy+105*Math.sin(a);
    let anchor="middle";
    if(Math.cos(a)>0.3) anchor="start";
    else if(Math.cos(a)<-0.3) anchor="end";
    const fill=(i===maxIdx)?"var(--accent)":"var(--dim)";
    labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9" fill="${fill}" text-anchor="${anchor}" dominant-baseline="middle">${esc(g)}</text>`;
  });

  box.innerHTML=`<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">${grid}${data}${labels}</svg>`;
  note.textContent=`判定${total}件 ・ 最も好み: ${GENRES[maxIdx]}`;
}

// ── feed search & recommend ──
const recLiked={};
function topGenre(){
  const gs=S.genreStats||{}; let best=null, bv=-1;
  for(const g of GENRES){
    const st=gs[g]; if(!st) continue;
    const t=st.y+st.n, v=t?((st.y+0.5)/(t+1))*(t/(t+3)):0;
    if(v>bv){ bv=v; best=g; }
  }
  return best||(GENRES.includes(activeGenre)?activeGenre:GENRES[0]);
}
function inferGenre(text){
  const t=text.toLowerCase();
  for(const g of GENRES){ if((GENRE_KW[g]||[]).some(k=>t.includes(k.toLowerCase()))) return g; }
  return topGenre();
}
async function feedlySearch(q){
  const url="https://cloud.feedly.com/v3/search/feeds?count=20&locale=ja&query="+encodeURIComponent(q);
  return raceFirst([url, ...PROXIES.map(p=>p(url))], 6000, async res=>{
    const j=await res.json();
    if(!j.results) return null;
    return j.results.map(r=>({
      title:(r.title||r.website||"無題"),
      url:(r.feedId||"").replace(/^feed\//,""),
      website:r.website||"",
      desc:r.description||"",
      subs:r.subscribers||0,
      lang:r.language||"",
      topics:[...(r.deliciousTags||[]),...(r.topics||[])].map(t=>typeof t==="string"?t:(t.label||"")).join(" "),
    })).filter(r=>/^https?:/.test(r.url));
  });
}
// YouTube検索結果ページのytInitialDataからチャンネルを抽出し、各チャンネルの
// RSSフィードURLを返す（best-effort。プロキシ越しに失敗したらnull）
function ytExtractBalanced(s, start){
  let depth=0, inStr=false, esc=false;
  for(let i=start;i<s.length;i++){
    const c=s[i];
    if(inStr){ if(esc) esc=false; else if(c==="\\") esc=true; else if(c==='"') inStr=false; }
    else { if(c==='"') inStr=true; else if(c==='{') depth++; else if(c==='}'){ if(--depth===0) return s.slice(start,i+1); } }
  }
  return null;
}
function ytSubsToNum(t){
  if(!t) return 0;
  const m=(""+t).replace(/,/g,"").match(/([\d.]+)\s*(億|万|k|m|b)?/i);
  if(!m) return 0;
  const mult={"億":1e8,"万":1e4,"k":1e3,"m":1e6,"b":1e9}[(m[2]||"").toLowerCase()]||1;
  return Math.round((parseFloat(m[1])||0)*mult);
}
function ytCollectChannels(obj, out, seen){
  if(!obj||typeof obj!=="object") return;
  if(Array.isArray(obj)){ for(const x of obj) ytCollectChannels(x,out,seen); return; }
  const cr=obj.channelRenderer||obj.gridChannelRenderer;
  if(cr&&cr.channelId&&!seen.has(cr.channelId)){
    seen.add(cr.channelId);
    const title=(cr.title&&cr.title.simpleText)||(cr.title&&cr.title.runs&&cr.title.runs[0]&&cr.title.runs[0].text)||"";
    const desc=((cr.descriptionSnippet&&cr.descriptionSnippet.runs)||[]).map(r=>r.text).join("");
    const subsText=(cr.videoCountText&&cr.videoCountText.simpleText)||(cr.subscriberCountText&&cr.subscriberCountText.simpleText)||"";
    if(title) out.push({channelId:cr.channelId,title,desc,subsText});
  }
  for(const k in obj) ytCollectChannels(obj[k], out, seen);
}
async function youtubeSearch(q){
  const yurl="https://www.youtube.com/results?search_query="+encodeURIComponent(q)+"&sp=EgIQAg==&hl=ja&gl=JP";
  return raceFirst(PROXIES.map(p=>p(yurl)), 8000, async res=>{
    const html=await res.text();
    const idx=html.indexOf("ytInitialData");
    if(idx<0) return null;
    const brace=html.indexOf("{", idx);
    if(brace<0) return null;
    let data; try{ data=JSON.parse(ytExtractBalanced(html, brace)); }catch(e){ return null; }
    const out=[]; ytCollectChannels(data, out, new Set());
    if(!out.length) return null;
    return out.slice(0,20).map(c=>({
      title:c.title,
      url:"https://www.youtube.com/feeds/videos.xml?channel_id="+c.channelId,
      website:"https://www.youtube.com/channel/"+c.channelId,
      desc:c.desc||"", subs:ytSubsToNum(c.subsText), lang:"", topics:"", yt:true,
    }));
  });
}
function rankResults(list, genre, gw=1.2, extraKw=[]){
  const kws=[...new Set([...(GENRE_KW[genre]||[genre]), ...extraKw])].map(k=>k.toLowerCase());
  for(const r of list){
    const text=(r.title+" "+r.desc+" "+r.topics).toLowerCase();
    r.genreHit=kws.some(k=>text.includes(k));
    r.pref=scoreOf(r.title+" "+r.desc);
    r.rank=r.pref*2 + (r.genreHit?gw:0) + Math.log10(r.subs+1)*0.5 + (r.lang==="ja"?0.6:0);
  }
  list.sort((a,b)=>b.rank-a.rank);
  return list;
}
function decorate(list, genre){
  const trained=judgeCount()>0;
  for(const r of list){
    const isYt=r.yt||/youtube\.com\/feeds/.test(r.url);
    r.meta=[isYt?"▶YouTube":(r.website||r.url),
            r.subs?(isYt?"登録":"読者")+r.subs.toLocaleString():"",
            r.genreHit?"♦"+genre:"",
            trained?"好み"+pct(r.pref)+"%":""].filter(Boolean).join(" ・ ");
  }
  return list;
}
async function discoverFromSite(siteUrl){
  if(!/^https?:\/\//.test(siteUrl)) siteUrl="https://"+siteUrl;
  const found=await raceFirst(PROXIES.map(p=>p(siteUrl)), 6000, async res=>{
    const doc=new DOMParser().parseFromString(await res.text(),"text/html");
    const links=[...doc.querySelectorAll('link[rel="alternate"]')]
      .filter(l=>/rss|atom|xml/i.test(l.getAttribute("type")||""));
    const out=[];
    for(const l of links){
      try{ out.push({ title:l.getAttribute("title")||"検出されたフィード",
                      url:new URL(l.getAttribute("href"),siteUrl).href, meta:siteUrl }); }catch(e){}
    }
    return out.length?out:null;
  });
  if(found) return found;
  const base=siteUrl.replace(/\/+$/,"");
  return ["/feed","/rss","/atom.xml","/index.rdf","/feed.xml"]
    .map(s=>({ title:"パス候補: "+s, url:base+s, meta:"自動検出失敗のため推測。追加後に●で生死確認" }));
}

function topKeywords(n, genre){
  const stop=new Set(["発売","公開","発表","開始","登場","話題","紹介","可能","必要","以上","対応","予定","限定","実施","決定","配信","掲載","本日","今日","記事","最新","注目"]);
  const cnt={};
  // ジャンル指定時はそのジャンルの◎記事から語彙を取る（該当が無い場合のみ全体へフォールバック）
  let src=S.saved;
  if(genre){ const f=S.saved.filter(a=>a.genre===genre); if(f.length>=1) src=f; }
  for(const a of src){
    const t=a.title;
    const words=[
      ...(t.match(/[\u30a0-\u30ff\u30fc]{3,}/g)||[]),
      ...(t.match(/[\u4e00-\u9fff]{2,4}/g)||[]),
      ...((t.toLowerCase().match(/[a-z]{3,}/g))||[]),
    ];
    new Set(words).forEach(w=>{ if(!stop.has(w)) cnt[w]=(cnt[w]||0)+1; });
  }
  let entries=Object.entries(cnt).filter(([w,c])=>c>=2);
  if(entries.length<n) entries=Object.entries(cnt);
  return entries.sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
// 頻出語上位poolSize語からランダムにn語選ぶ（毎回違う検索になる）
function sampleKeywords(n, poolSize=8, genre=null){
  const pool=topKeywords(poolSize, genre);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,n);
}
// 在庫切れ時: 学習傾向からおすすめフィードを探し、その場で記事を取得してデッキに追加する。
// 探索済みフィードはS.recSeenに記録して次回は除外し、押すたびに別のフィードへ掘り進む
async function recommendArticles(){
  if(S.saved.length<5){ setStatus("学習データ不足。◎を5件以上溜めてから再実行しろ。"); renderStage(); return; }
  setStatus("おすすめフィードを分析中…");
  S.recSeen=S.recSeen||{};
  const now=Date.now();
  for(const u of Object.keys(S.recSeen)) if(now-S.recSeen[u]>7*24*3600000) delete S.recSeen[u];
  // 選択中のカテゴリを探索の前提にする（未選択時は最も好みのジャンル）
  const selected=GENRES.includes(activeGenre)?activeGenre:null;
  const ctxGenre=selected||topGenre();
  const genreWords=GENRE_KW[ctxGenre]||[ctxGenre];
  const sampled=sampleKeywords(3, 8, selected);
  let kws;
  if(selected){
    // カテゴリ選択中はジャンル代表語を先頭に置き、YouTube検索（先頭2語）も含めカテゴリへ強く寄せる
    kws=[...genreWords, ...sampled].filter((w,i,a)=>a.indexOf(w)===i).slice(0,5);
  }else{
    kws=[...sampled];
    for(const g of genreWords.slice(0,2)) if(!kws.includes(g)) kws.push(g);
  }
  const lists=await Promise.all([...kws.map(k=>feedlySearch(k)), ...kws.slice(0,2).map(k=>youtubeSearch(k))]);
  const inFeeds=new Set(S.feeds.map(f=>f.url)); const all=[];
  for(const r of lists){ if(r) for(const x of r){ if(!inFeeds.has(x.url)&&!all.some(c=>c.url===x.url)) all.push(x); } }
  let cands=all.filter(c=>!S.recSeen[c.url]);
  if(!cands.length&&all.length){
    // 未探索の候補が尽きたら、古い探索履歴の半分を解放して再利用（新着記事を拾い直せる）
    const ent=Object.entries(S.recSeen).sort((a,b)=>a[1]-b[1]);
    ent.slice(0,Math.ceil(ent.length/2)).forEach(([u])=>delete S.recSeen[u]);
    cands=all.filter(c=>!S.recSeen[c.url]);
  }
  if(!cands.length){ setStatus("おすすめフィードが見つからない。◎を増やすと検索語彙が広がる。"); save(); renderStage(); return; }
  rankResults(cands, ctxGenre, selected?2.5:1.2, selected?kws:[]);
  const picks=cands.slice(0,4).map(c=>({ name:c.title.slice(0,30), url:c.url, genre:selected||inferGenre(c.title+" "+c.desc+" "+c.topics) }));
  picks.forEach(p=>S.recSeen[p.url]=now);
  setStatus("おすすめ記事を取得中…");
  const results=await Promise.all(picks.map(async p=>{
    const items=await raceFirst(PROXIES.map(px=>px(p.url)), 6500, async res=>{
      const list=parseFeed(await res.text(), p);
      return list.length?list:null;
    });
    return (items||[]).map(a=>Object.assign(a,{rec:true,recFeed:p}));
  }));
  const seenH=new Set(articles.map(a=>a.hash));
  const fresh=results.flat().filter(a=>!S.rated[a.hash]&&!seenH.has(a.hash)&&seenH.add(a.hash));
  if(!fresh.length){ setStatus("このフィード群に新着なし。もう一度押すと別のフィードを探す。"); save(); renderStage(); return; }
  articles.push(...fresh);
  rescore();
  lastRate=null;
  if(!selected) activeGenre="すべて";
  renderChips();
  buildDeck(); renderStage();
  setStatus("カテゴリ「"+ctxGenre+"」を参照し「"+kws.join("」「")+"」で探索: "+fresh.length+"件追加（提供元"+picks.length+"フィード）");
  save(); saveArticles();
}
document.getElementById("recBtn").onclick=async()=>{
  if(S.saved.length<5){ renderResults([], "学習データ不足。◎を5件以上溜めてから再実行しろ。"); return; }
  const btn=document.getElementById("recBtn");
  btn.disabled=true; btn.textContent="分析中…";
  const genre=document.getElementById("searchGenre").value;
  const kws=topKeywords(3);
  const all=[]; const seen=new Set(S.feeds.map(f=>f.url));
  const lists=await Promise.all([...kws.map(k=>feedlySearch(k)), ...kws.slice(0,2).map(k=>youtubeSearch(k))]);
  for(const r of lists){
    if(r) for(const x of r){ if(!seen.has(x.url)&&!all.some(a=>a.url===x.url)) all.push(x); }
  }
  rankResults(all, genre);
  renderResults(decorate(all.slice(0,12), genre), "◎傾向の頻出語「"+kws.join("」「")+"」でWeb+YouTubeを検索し、好み適合度・登録者数順に並べ替えた:");

};
document.getElementById("searchBtn").onclick=async()=>{
  const q=document.getElementById("q").value.trim();
  if(!q) return;
  const btn=document.getElementById("searchBtn");
  btn.disabled=true; btn.textContent="検索中…";
  const isUrl=/^(https?:\/\/|[\w-]+\.[\w.-]+\/?)/.test(q)&&q.includes(".")&&!q.includes(" ");
  if(isUrl){
    renderResults(await discoverFromSite(q));
  }else{
    const genre=document.getElementById("searchGenre").value;
    const gkw=(GENRE_KW[genre]||[genre])[0];
    const [r1,r2,ry]=await Promise.all([feedlySearch(q), feedlySearch(q+" "+gkw), youtubeSearch(q)]);
    if(!r1&&!r2&&!ry){ renderResults(null); }
    else{
      const all=[];
      for(const r of [...(ry||[]),...(r2||[]),...(r1||[])]) if(!all.some(a=>a.url===r.url)) all.push(r);
      rankResults(all, genre);
      renderResults(decorate(all.slice(0,12), genre), "ジャンル「"+genre+"」を考慮し、Web+YouTubeを好み適合度・登録者数順に並べ替えた:");
    }
  }
  btn.disabled=false; btn.textContent="フィードを検索";
};

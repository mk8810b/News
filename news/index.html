<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>Feed</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23101418'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%23E0A435'%3E◎%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink:#101418; --card:#1A2026; --edge:#2A323B;
    --paper:#E8E4DA; --dim:rgba(232,228,218,0.5);
    --accent:#E0A435; --pos:#5BB385; --neg:#D0604F;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--ink); color:var(--paper);
    font-family:-apple-system,'Hiragino Sans',sans-serif;
    padding:max(24px, env(safe-area-inset-top)) 14px 60px;
    max-width:560px; margin:0 auto; overscroll-behavior:none;
  }
  header { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { font-family:Georgia,'Hiragino Mincho ProN',serif; font-size:26px; }
  h1 span { color:var(--accent); }
  /* level */
  .lv { margin-top:8px; }
  .lv .row1 { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; }
  .lv .name { font-weight:700; color:var(--accent); font-size:13px; }
  .lv .next { color:var(--dim); font-size:11px; }
  .lv .track { height:5px; background:var(--edge); border-radius:99px; margin-top:6px; overflow:hidden; }
  .lv .fill { height:100%; background:linear-gradient(90deg,var(--accent),#F0C870); border-radius:99px; transition:width .4s ease; }
  .badge {
    display:none; position:fixed; bottom:max(20px, env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%); z-index:99;
    padding:8px 16px; border-radius:99px; font-size:12px;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
  }
  .badge.error { display:block; background:#2A1714; color:var(--neg); border:1px solid rgba(208,96,79,0.5); }
  .chips { display:flex; gap:7px; overflow-x:auto; padding:14px 0 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; padding:7px 14px; border-radius:99px; font-size:13px;
    border:1px solid var(--edge); background:transparent; color:var(--dim); cursor:pointer;
  }
  .chip.on { background:var(--accent); color:#1A1408; border-color:var(--accent); font-weight:600; }
  .bar { display:flex; gap:8px; margin:12px 0 4px; }
  .bar button {
    flex:1; padding:12px 0; border-radius:10px; font-size:14px; font-weight:600;
    border:1px solid var(--edge); background:var(--card); color:var(--paper); cursor:pointer;
  }
  .bar button.primary { background:var(--accent); color:#1A1408; border-color:var(--accent); }
  .bar button:disabled { opacity:0.4; }
  .status { font-size:11px; color:var(--dim); margin:8px 2px; min-height:14px; }
  /* deck */
  .deck-head { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin:8px 2px 10px; }
  .deck-head b { color:var(--paper); }
  .stack { position:relative; height:300px; }
  .dcard {
    position:absolute; inset:0; background:var(--card);
    border:1px solid var(--edge); border-radius:18px; padding:20px 18px;
    display:flex; flex-direction:column; touch-action:pan-y;
    will-change:transform;
  }
  .dcard.back { transform:scale(0.95) translateY(10px); opacity:0.55; pointer-events:none; }
  .dcard .score {
    font-family:Georgia,serif; font-size:30px; font-weight:700; color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .dcard .score small { font-family:-apple-system,sans-serif; font-size:10px; color:var(--dim); letter-spacing:0.15em; margin-left:4px; }
  .dcard a { color:var(--paper); text-decoration:none; font-size:18px; line-height:1.5; font-weight:600; display:block; margin-top:10px; flex:1; overflow:hidden; }
  .dcard .sub { font-size:12px; color:var(--dim); }
  .dcard .sub .genre { color:var(--accent); }
  .ov {
    position:absolute; top:16px; font-size:22px; font-weight:800; padding:6px 14px;
    border-radius:10px; border:2.5px solid; opacity:0; transform:rotate(-8deg);
  }
  .ov.yes { left:16px; color:var(--pos); border-color:var(--pos); }
  .ov.no  { right:16px; color:var(--neg); border-color:var(--neg); transform:rotate(8deg); }
  .deck-acts { display:flex; gap:12px; margin-top:14px; }
  .deck-acts button {
    flex:1; padding:15px 0; border-radius:13px; font-size:16px; font-weight:700;
    border:1.5px solid; background:transparent; cursor:pointer;
  }
  .deck-acts .yes { color:var(--pos); border-color:rgba(91,179,133,0.5); }
  .deck-acts .no  { color:var(--dim); border-color:var(--edge); }
  .hint { text-align:center; font-size:11px; color:var(--dim); margin-top:10px; }
  /* completion */
  .done {
    text-align:center; padding:46px 0 30px;
  }
  .done .big { font-family:Georgia,serif; font-size:30px; color:var(--accent); }
  .done .stats { font-size:14px; color:var(--dim); margin:14px 0 22px; line-height:1.9; }
  .done .stats b.y { color:var(--pos); } .done .stats b.n { color:var(--neg); }
  .done button {
    padding:14px 30px; border-radius:12px; border:none; background:var(--accent);
    color:#1A1408; font-size:15px; font-weight:700; cursor:pointer;
  }
  .empty { text-align:center; color:var(--dim); font-size:13px; padding:34px 0; line-height:1.8; }
  /* saved list */
  .art { background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:13px 14px; margin-top:9px; }
  .art .top { display:flex; gap:10px; align-items:flex-start; }
  .art a { color:var(--paper); text-decoration:none; font-size:15px; line-height:1.45; font-weight:500; display:block; }
  .art .sub { font-size:11px; color:var(--dim); margin-top:5px; }
  .art .sub .genre { color:var(--accent); }
  .art .del { background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:2px 6px; }
  /* feed manager */
  .mgr { margin-top:26px; border-top:1px solid var(--edge); padding-top:14px; }
  .mgr-toggle { background:none; border:none; color:var(--dim); font-size:13px; cursor:pointer; padding:6px 2px; }
  .feed-row { display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid rgba(42,50,59,0.5); font-size:13px; }
  .dot { flex:0 0 8px; width:8px; height:8px; border-radius:99px; background:var(--dim); }
  .dot.ok { background:var(--pos); } .dot.fail { background:var(--neg); }
  .feed-row .g { color:var(--accent); font-size:11px; flex:0 0 auto; }
  .feed-row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed-row .del { background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:2px 6px; }
  .add { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .add input, .add select {
    padding:11px 12px; border-radius:9px; border:1px solid var(--edge);
    background:rgba(0,0,0,0.25); color:var(--paper); font-size:14px; outline:none;
  }
  .add button {
    padding:12px 0; border-radius:9px; border:none; background:var(--accent);
    color:#1A1408; font-size:14px; font-weight:700; cursor:pointer;
  }
  .add button.ghost { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  .res-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid rgba(42,50,59,0.5); }
  .res-row .info { flex:1; min-width:0; }
  .res-row .t { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .res-row .m { font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
  .res-row .addF {
    flex:0 0 auto; padding:8px 14px; border-radius:9px; font-size:12px; font-weight:700;
    border:none; background:var(--accent); color:#1A1408; cursor:pointer;
  }
  .res-row .addF:disabled { background:var(--edge); color:var(--dim); }
  .res-note { font-size:11px; color:var(--dim); padding:10px 2px 2px; }
  .io { display:flex; gap:8px; margin-top:18px; }
  .io button {
    flex:1; padding:10px 0; border-radius:9px; font-size:12px;
    border:1px solid var(--edge); background:transparent; color:var(--dim); cursor:pointer;
  }
</style>
</head>
<body>
<header>
  <h1>Feed<span>.</span></h1>
</header>
<div class="lv">
  <div class="row1">
    <span class="name" id="lvName">Lv.1 見習い</span>
    <span class="next" id="lvNext"></span>
  </div>
  <div class="track"><div class="fill" id="lvFill" style="width:0%"></div></div>
</div>
<div class="badge" id="badge"></div>

<div class="chips" id="chips"></div>

<div class="bar"><button class="primary" id="refresh">記事を取得</button></div>
<div class="status" id="status"></div>

<div id="stage"><div class="empty">「記事を取得」で開始。<br>カードを右スワイプ＝◎ / 左スワイプ＝×。</div></div>

<div class="mgr">
  <button class="mgr-toggle" id="mgrToggle">▸ フィード管理</button>
  <div id="mgrBody" style="display:none">
    <div id="feedList"></div>
    <div class="add" style="margin-top:16px">
      <select id="searchGenre"></select>
      <input type="text" id="q" placeholder="キーワード または サイトURLで検索">
      <button id="searchBtn">フィードを検索</button>
      <button class="ghost" id="recBtn">学習傾向からおすすめフィードを探す</button>
    </div>
    <div id="searchResults"></div>
    <div class="add">
      <select id="addGenre"></select>
      <input type="text" id="addName" placeholder="フィード名（手動追加）">
      <input type="url" id="addUrl" placeholder="RSSのURL（https://...）">
      <button id="addBtn">フィードを追加</button>
    </div>
    <div class="io">
      <button id="exportBtn">データを書き出す</button>
      <button id="importBtn">データを読み込む</button>
    </div>
  </div>
</div>

<script>
const KEY = "news-app-v1";
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
];
const GENRES = ["テック/AI","科学","投資/経済","ポーカー","アニメ","エンタメ","心理学","ペット","釣り","アダルト"];
const GENRE_KW = {
  "テック/AI":["テクノロジー","ai","tech","it"],
  "科学":["科学","サイエンス","science"],
  "投資/経済":["投資","経済","マネー","finance"],
  "ポーカー":["ポーカー","poker"],
  "アニメ":["アニメ","漫画","anime","manga"],
  "エンタメ":["エンタメ","芸能","音楽","映画"],
  "心理学":["心理学","心理","psychology"],
  "ペット":["ペット","犬","猫","pet"],
  "釣り":["釣り","フィッシング","fishing"],
  "アダルト":["アダルト"],
};
const DECK_SIZE = 30;
const LV_TITLES = ["見習い","観察者","分類屋","選別士","目利き","分析官","鑑定士","審美眼","賢者","フィード神"];

const DEFAULT_FEEDS = [
  { genre:"テック/AI", name:"GIGAZINE", url:"https://gigazine.net/news/rss_2.0/" },
  { genre:"テック/AI", name:"ITmedia AI+", url:"https://rss.itmedia.co.jp/rss/2.0/aiplus.xml" },
  { genre:"科学", name:"ナゾロジー", url:"https://nazology.net/feed" },
  { genre:"投資/経済", name:"東洋経済", url:"https://toyokeizai.net/list/feed/rss" },
  { genre:"投資/経済", name:"NHK経済", url:"https://www3.nhk.or.jp/rss/news/cat5.xml" },
  { genre:"ポーカー", name:"PokerNews(EN)", url:"https://www.pokernews.com/rss.php" },
  { genre:"アニメ", name:"コミックナタリー", url:"https://natalie.mu/comic/feed/news" },
  { genre:"アニメ", name:"アニメ!アニメ!", url:"https://animeanime.jp/rss20/index.rdf" },
  { genre:"エンタメ", name:"音楽ナタリー", url:"https://natalie.mu/music/feed/news" },
  { genre:"心理学", name:"カラパイア", url:"https://karapaia.com/index.rdf" },
  { genre:"ペット", name:"sippo", url:"https://sippo.asahi.com/rss/index.rdf" },
  { genre:"釣り", name:"TSURINEWS", url:"https://tsurinews.jp/feed/" },
];

// ── state ──
let S = {
  feeds: DEFAULT_FEEDS.map((f,i)=>({ id:"d"+i, ...f })),
  model: { like:{}, dis:{}, likeN:0, disN:0 },
  rated: {},
  saved: [],
};
let articles = [];
let deck = [];
let deckStats = { yes:0, no:0 };
let feedStatus = {};
let activeGenre = "すべて";

// ── storage ──
function showBadge(t, ok){
  if(ok) return;
  const b=document.getElementById("badge");
  b.textContent=t; b.className="badge error";
  clearTimeout(showBadge._t); showBadge._t=setTimeout(()=>b.className="badge",3000);
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){ showBadge("⚠ 読み込みに失敗",false); } }
function save(){
  try{
    const j=JSON.stringify(S);
    localStorage.setItem(KEY,j);
    if(localStorage.getItem(KEY)!==j) showBadge("⚠ 保存に失敗",false);
  }catch(e){ showBadge("⚠ 保存に失敗",false); }
}

// ── learning ──
function feats(text){
  const f=new Set(), t=text.toLowerCase();
  (t.match(/[a-z0-9]{2,}/g)||[]).forEach(w=>f.add(w));
  t.replace(/[^\u3040-\u30ff\u4e00-\u9fff\u30fc]+/g," ").split(" ").forEach(seq=>{
    if(seq.length===1) f.add(seq);
    for(let i=0;i<seq.length-1;i++) f.add(seq.slice(i,i+2));
  });
  return [...f];
}
function scoreOf(title){
  const m=S.model, fs=feats(title);
  if(!fs.length || (m.likeN+m.disN)===0) return 0;
  // 学習済みの語だけを根拠に、◎内/×内の出現率の対数オッズを取る。
  // 件数ではなく率で比較するため◎×の件数の偏りに影響されない
  let s=0, n=0;
  for(const f of fs){
    const l=m.like[f]||0, d=m.dis[f]||0;
    if(l+d===0) continue;
    const rl=m.likeN?l/m.likeN:0, rd=m.disN?d/m.disN:0;
    s += Math.log((rl+0.1)/(rd+0.1));
    n++;
  }
  if(!n) return 0;
  // 根拠語が少ないタイトルは50%側へ縮退
  return (s/n)*(n/(n+4));
}
function pct(score){ return Math.max(1, Math.min(99, Math.round(100/(1+Math.exp(-score*2.2))))); }
function train(title, like){
  const m=S.model;
  for(const f of feats(title)){ const tbl=like?m.like:m.dis; tbl[f]=(tbl[f]||0)+1; }
  like?m.likeN++:m.disN++;
}

// ── level ──
function lvThreshold(l){ return 10*l*(l+1)/2; } // L2:10 L3:30 L4:60 L5:100...
function renderLevel(){
  const total=S.model.likeN+S.model.disN;
  let lv=1;
  while(lv<LV_TITLES.length && total>=lvThreshold(lv)) lv++;
  const lo=lvThreshold(lv-1), hi=lvThreshold(lv);
  const maxed=lv>=LV_TITLES.length && total>=lvThreshold(LV_TITLES.length-1);
  document.getElementById("lvName").textContent="Lv."+lv+" "+LV_TITLES[lv-1];
  document.getElementById("lvNext").textContent=maxed?"判定 "+total+"件 ・ MAX":"次のLvまであと"+(hi-total)+"判定（計"+total+"件）";
  document.getElementById("lvFill").style.width=(maxed?100:Math.round((total-lo)/(hi-lo)*100))+"%";
}

// ── fetch & parse ──
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return "h"+(h>>>0).toString(36); }
function parseFeed(xmlText, feed){
  const doc=new DOMParser().parseFromString(xmlText,"text/xml");
  if(doc.querySelector("parsererror")) return [];
  let nodes=[...doc.querySelectorAll("item")];
  if(!nodes.length) nodes=[...doc.querySelectorAll("entry")];
  return nodes.slice(0,15).map(n=>{
    const q=t=>n.querySelector(t);
    const title=(q("title")?.textContent||"").trim();
    let link=q("link")?.textContent?.trim();
    if(!link) link=q("link")?.getAttribute("href")||"";
    let date=q("pubDate")?.textContent || q("updated")?.textContent || q("published")?.textContent || "";
    if(!date){ const dc=n.getElementsByTagName("dc:date"); if(dc.length) date=dc[0].textContent; }
    if(!title||!link) return null;
    return { hash:hash(link), title, link, genre:feed.genre, source:feed.name,
             date: date?new Date(date).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"}):"" };
  }).filter(Boolean);
}
async function fetchFeed(feed){
  feedStatus[feed.id]="loading"; renderFeeds();
  for(const proxy of PROXIES){
    try{
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),12000);
      const res=await fetch(proxy(feed.url),{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok) continue;
      const items=parseFeed(await res.text(), feed);
      if(!items.length) continue;
      feedStatus[feed.id]="ok";
      return items;
    }catch(e){}
  }
  feedStatus[feed.id]="fail";
  return [];
}
async function refresh(){
  const btn=document.getElementById("refresh");
  btn.disabled=true;
  const targets=S.feeds.filter(f=>activeGenre==="すべて"||activeGenre==="★保存済み"||f.genre===activeGenre);
  if(!targets.length){ setStatus("このジャンルのフィードが未登録。フィード管理から追加しろ。"); btn.disabled=false; return; }
  setStatus("取得中… 0/"+targets.length);
  const results=[]; let done=0;
  await Promise.all(targets.map(async f=>{
    results.push(...await fetchFeed(f));
    setStatus("取得中… "+(++done)+"/"+targets.length);
  }));
  const seen=new Set();
  articles=results.filter(a=>!S.rated[a.hash]&&!seen.has(a.hash)&&seen.add(a.hash));
  articles.forEach(a=>a.score=scoreOf(a.title));
  articles.sort((a,b)=>b.score-a.score);
  const fails=targets.filter(f=>feedStatus[f.id]==="fail").length;
  setStatus(articles.length+"件取得"+(fails?"（"+fails+"フィードが取得失敗）":""));
  btn.disabled=false;
  buildDeck(); renderStage(); renderFeeds();
}
function setStatus(t){ document.getElementById("status").textContent=t; }

// ── deck ──
function buildDeck(){
  const pool=articles.filter(a=>!S.rated[a.hash]&&(activeGenre==="すべて"||a.genre===activeGenre));
  deck=pool.slice(0,DECK_SIZE);
  deckStats={yes:0,no:0};
}
function esc(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cardHTML(a, back){
  return `<div class="dcard ${back?"back":""}" data-h="${a.hash}">
    <div class="ov yes">◎ 興味あり</div>
    <div class="ov no">× 興味なし</div>
    <div class="score">${pct(a.score)}<small>MATCH</small></div>
    <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
    <div class="sub"><span class="genre">${a.genre}</span> ・ ${esc(a.source)}${a.date?" ・ "+a.date:""}</div>
  </div>`;
}
function renderStage(){
  renderLevel();
  const st=document.getElementById("stage");
  if(activeGenre==="★保存済み"){ renderSaved(st); return; }
  if(!deck.length){
    const remaining=articles.filter(a=>!S.rated[a.hash]&&(activeGenre==="すべて"||a.genre===activeGenre)).length;
    if(deckStats.yes+deckStats.no>0){
      st.innerHTML=`<div class="done">
        <div class="big">デッキ完了</div>
        <div class="stats"><b class="y">◎ ${deckStats.yes}</b> ／ <b class="n">× ${deckStats.no}</b><br>学習データ計 ${S.model.likeN+S.model.disN} 件</div>
        ${remaining>0?'<button id="nextDeck">次の'+Math.min(DECK_SIZE,remaining)+'枚を引く</button>':'<div class="empty" style="padding:6px 0">在庫切れ。「記事を取得」で補充しろ。</div>'}
      </div>`;
      const nb=document.getElementById("nextDeck");
      if(nb) nb.onclick=()=>{ buildDeck(); renderStage(); };
    } else {
      st.innerHTML='<div class="empty">表示できる記事がない。<br>「記事を取得」を押すか、ジャンルを切り替えろ。</div>';
    }
    return;
  }
  st.innerHTML=`
    <div class="deck-head"><span>残り <b>${deck.length}</b> / ${DECK_SIZE}</span><span>◎ ${deckStats.yes} ／ × ${deckStats.no}</span></div>
    <div class="stack">
      ${deck[1]?cardHTML(deck[1],true):""}
      ${cardHTML(deck[0],false)}
    </div>
    <div class="deck-acts">
      <button class="no">× 興味なし</button>
      <button class="yes">◎ 興味あり</button>
    </div>
    <div class="hint">右スワイプ＝◎ ／ 左スワイプ＝× ／ タイトルタップで記事を開く</div>`;
  const top=st.querySelector(".dcard:not(.back)");
  attachSwipe(top);
  st.querySelector(".deck-acts .yes").onclick=()=>flyOut(top,true);
  st.querySelector(".deck-acts .no").onclick=()=>flyOut(top,false);
}
function attachSwipe(card){
  let sx=0, sy=0, dx=0, dy=0, active=false;
  card.addEventListener("touchstart",e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; dx=0; dy=0; active=true;
    card.style.transition="none";
  },{passive:true});
  card.addEventListener("touchmove",e=>{
    if(!active) return;
    const t=e.touches[0]; dx=t.clientX-sx; dy=t.clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)+6) e.preventDefault();
    card.style.transform=`translate(${dx}px,${dy*0.15}px) rotate(${dx/14}deg)`;
    card.querySelector(".ov.yes").style.opacity=Math.max(0,Math.min(1,dx/90));
    card.querySelector(".ov.no").style.opacity=Math.max(0,Math.min(1,-dx/90));
  },{passive:false});
  card.addEventListener("touchend",()=>{
    if(!active) return; active=false;
    if(dx>90) flyOut(card,true,dy);
    else if(dx<-90) flyOut(card,false,dy);
    else{
      card.style.transition="transform .22s ease";
      card.style.transform="";
      card.querySelectorAll(".ov").forEach(o=>o.style.opacity=0);
    }
  });
}
function flyOut(card, like, dy=0){
  card.style.transition="transform .28s ease, opacity .28s";
  card.style.transform=`translate(${like?120:-120}vw,${dy}px) rotate(${like?22:-22}deg)`;
  card.querySelector(like?".ov.yes":".ov.no").style.opacity=1;
  setTimeout(()=>commitRate(like),230);
}
function commitRate(like){
  const a=deck[0]; if(!a) return;
  train(a.title, like);
  S.rated[a.hash]=1;
  if(like){ S.saved.unshift({title:a.title,link:a.link,genre:a.genre,source:a.source,date:a.date}); if(S.saved.length>200) S.saved.pop(); }
  like?deckStats.yes++:deckStats.no++;
  deck.shift();
  save(); renderStage();
}
function renderSaved(st){
  if(!S.saved.length){ st.innerHTML='<div class="empty">保存済みの記事はまだない。<br>◎を付けた記事がここに溜まる。</div>'; return; }
  st.innerHTML=S.saved.map((a,i)=>`
    <div class="art">
      <div class="top">
        <div style="flex:1">
          <a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
          <div class="sub"><span class="genre">${a.genre}</span> ・ ${esc(a.source)}${a.date?" ・ "+a.date:""}</div>
        </div>
        <button class="del" data-i="${i}">×</button>
      </div>
    </div>`).join("");
  st.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    S.saved.splice(Number(b.dataset.i),1); save(); renderStage();
  });
}

// ── chips / feeds ──
function renderChips(){

function renderFeeds(){

    <div class="feed-row">

// ── feed search & recommend ──
async function feedlySearch(q){
  const url="https://cloud.feedly.com/v3/search/feeds?count=20&locale=ja&query="+encodeURIComponent(q);
  const tries=[u=>u, ...PROXIES];
  for(const p of tries){
    try{
      const res=await fetch(p(url)); if(!res.ok) continue;
      const j=await res.json();
      if(!j.results) continue;
      return j.results.map(r=>({
        title:(r.title||r.website||"無題"),
        url:(r.feedId||"").replace(/^feed\//,""),
        website:r.website||"",
        desc:r.description||"",
        subs:r.subscribers||0,
        lang:r.language||"",
        topics:[...(r.deliciousTags||[]),...(r.topics||[])].map(t=>typeof t==="string"?t:(t.label||"")).join(" "),
      })).filter(r=>/^https?:/.test(r.url));
    }catch(e){}
  }
  return null;
}
// ジャンル適合・学習済みの好み・読者数・言語で複合スコアを付けて並べ替える
function rankResults(list, genre){
  const kws=(GENRE_KW[genre]||[genre]).map(k=>k.toLowerCase());
  for(const r of list){
    const text=(r.title+" "+r.desc+" "+r.topics).toLowerCase();
    r.genreHit=kws.some(k=>text.includes(k));
    r.pref=scoreOf(r.title+" "+r.desc);
    r.rank=r.pref*2 + (r.genreHit?1.2:0) + Math.log10(r.subs+1)*0.5 + (r.lang==="ja"?0.6:0);
  }
  list.sort((a,b)=>b.rank-a.rank);
  return list;
}
function decorate(list, genre){
  const trained=(S.model.likeN+S.model.disN)>0;
  for(const r of list){
    r.meta=[r.website||r.url,
            r.subs?"読者"+r.subs.toLocaleString():"",
            r.genreHit?"♦"+genre:"",
            trained?"好み"+pct(r.pref)+"%":""].filter(Boolean).join(" ・ ");
  }
  return list;
}
async function discoverFromSite(siteUrl){
  if(!/^https?:\/\//.test(siteUrl)) siteUrl="https://"+siteUrl;
  for(const p of PROXIES){
    try{
      const res=await fetch(p(siteUrl)); if(!res.ok) continue;
      const doc=new DOMParser().parseFromString(await res.text(),"text/html");
      const links=[...doc.querySelectorAll('link[rel="alternate"]')]
        .filter(l=>/rss|atom|xml/i.test(l.getAttribute("type")||""));
      const out=[];
      for(const l of links){
        try{ out.push({ title:l.getAttribute("title")||"検出されたフィード",
                        url:new URL(l.getAttribute("href"),siteUrl).href, meta:siteUrl }); }catch(e){}
      }
      if(out.length) return out;
      const base=siteUrl.replace(/\/+$/,"");
      return ["/feed","/rss","/atom.xml","/index.rdf","/feed.xml"]
        .map(s=>({ title:"パス候補: "+s, url:base+s, meta:"自動検出失敗のため推測。追加後に●で生死確認" }));
    }catch(e){}
  }
  return null;
}
function renderResults(results, note){
  const el=document.getElementById("searchResults");
  let head=note?`<div class="res-note">${esc(note)}</div>`:"";
  if(!results){ el.innerHTML=head+'<div class="empty" style="padding:16px 0">検索に失敗した。時間を置いて再試行しろ。</div>'; return; }
  if(!results.length){ el.innerHTML=head+'<div class="empty" style="padding:16px 0">該当するフィードが見つからない。</div>'; return; }
  const existing=new Set(S.feeds.map(f=>f.url));
  el.innerHTML=head+results.map((r,i)=>`
    <div class="res-row">
      <div class="info">
        <div class="t">${esc(r.title)}</div>
        <div class="m">${esc(r.meta||r.url)}</div>
      </div>
      <button class="addF" data-i="${i}" ${existing.has(r.url)?"disabled":""}>${existing.has(r.url)?"追加済":"追加"}</button>
    </div>`).join("");
  el.querySelectorAll(".addF").forEach(b=>b.onclick=()=>{
    const r=results[Number(b.dataset.i)];
    S.feeds.push({ id:"u"+Date.now(), genre:document.getElementById("searchGenre").value,
                   name:r.title.slice(0,30), url:r.url });
    save(); renderFeeds();
    b.disabled=true; b.textContent="追加済";
  });
}
function topKeywords(n){
  const stop=new Set(["発売","公開","発表","開始","登場","話題","紹介","可能","必要","以上","対応","予定","限定","実施","決定","配信","掲載","本日","今日","記事","最新","注目"]);
  const cnt={};
  for(const a of S.saved){
    const t=a.title;
    const words=[
      ...(t.match(/[\u30a0-\u30ff\u30fc]{3,}/g)||[]),
      ...(t.match(/[\u4e00-\u9fff]{2,4}/g)||[]),
      ...((t.toLowerCase().match(/[a-z]{3,}/g))||[]),
    ];
    new Set(words).forEach(w=>{ if(!stop.has(w)) cnt[w]=(cnt[w]||0)+1; });
  }
  let entries=Object.entries(cnt).filter(([w,c])=>c>=2);
  if(entries.length<n) entries=Object.entries(cnt);
  return entries.sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
document.getElementById("recBtn").onclick=async()=>{
  if(S.saved.length<5){ renderResults([], "学習データ不足。◎を5件以上溜めてから再実行しろ。"); return; }
  const btn=document.getElementById("recBtn");
  btn.disabled=true; btn.textContent="分析中…";
  const genre=document.getElementById("searchGenre").value;
  const kws=topKeywords(3);
  const all=[]; const seen=new Set(S.feeds.map(f=>f.url));
  const lists=await Promise.all(kws.map(k=>feedlySearch(k)));
  for(const r of lists){
    if(r) for(const x of r){ if(!seen.has(x.url)&&!all.some(a=>a.url===x.url)) all.push(x); }
  }
  rankResults(all, genre);
  renderResults(decorate(all.slice(0,12), genre), "◎傾向の頻出語「"+kws.join("」「")+"」で検索し、好み適合度・読者数順に並べ替えた:");
  btn.disabled=false; btn.textContent="学習傾向からおすすめフィードを探す";
};
document.getElementById("searchBtn").onclick=async()=>{
  const q=document.getElementById("q").value.trim();
  if(!q) return;
  const btn=document.getElementById("searchBtn");
  btn.disabled=true; btn.textContent="検索中…";
  const isUrl=/^(https?:\/\/|[\w-]+\.[\w.-]+\/?)/.test(q)&&q.includes(".")&&!q.includes(" ");
  if(isUrl){
    renderResults(await discoverFromSite(q));
  }else{
    const genre=document.getElementById("searchGenre").value;
    const gkw=(GENRE_KW[genre]||[genre])[0];
    const [r1,r2]=await Promise.all([feedlySearch(q), feedlySearch(q+" "+gkw)]);
    if(!r1&&!r2){ renderResults(null); }
    else{
      const all=[];
      for(const r of [...(r2||[]),...(r1||[])]) if(!all.some(a=>a.url===r.url)) all.push(r);
      rankResults(all, genre);
      renderResults(decorate(all.slice(0,12), genre), "ジャンル「"+genre+"」を考慮し、好み適合度・読者数順に並べ替えた:");
    }
  }
  btn.disabled=false; btn.textContent="フィードを検索";
};

  catch(e){ showBadge("⚠ データ形式が不正",false); }
};

load(); renderChips(); renderFeeds(); renderStage();
